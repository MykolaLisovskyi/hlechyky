services:
  liquidsoap:
    image: savonet/liquidsoap:v2.4.x-latest
    container_name: hlechyky-liq
    restart: unless-stopped
    command: ["liquidsoap", "/radio.liq"]
    ports:
      - "127.0.0.1:1234:1234"
    volumes:
      - ./radio.liq:/radio.liq:ro
      - ../cache:/cache:ro
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
